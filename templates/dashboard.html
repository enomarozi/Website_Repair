{% extends "layout/base.html" %}

{% block title %}Dashboard - Website Repair{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="h3 mb-1">Dashboard</h1>
        <p class="text-body-secondary mb-0">Selamat datang, {{ current_user.username }}.</p>
    </div>
</div>

<div class="row g-3">
    <div class="col-12 col-sm-6 col-xl-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-body-secondary mb-1">Total Barang</p>
                        <h3 class="mb-0">128</h3>
                    </div>
                    <i class="bi bi-box-seam fs-2 text-primary"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="col-12 col-sm-6 col-xl-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-body-secondary mb-1">Menunggu</p>
                        <h3 class="mb-0">12</h3>
                    </div>
                    <i class="bi bi-hourglass-split fs-2 text-warning"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="col-12 col-sm-6 col-xl-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-body-secondary mb-1">Dalam Perbaikan</p>
                        <h3 class="mb-0">8</h3>
                    </div>
                    <i class="bi bi-tools fs-2 text-info"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="col-12 col-sm-6 col-xl-3">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-body-secondary mb-1">Selesai</p>
                        <h3 class="mb-0">108</h3>
                    </div>
                    <i class="bi bi-check-circle fs-2 text-success"></i>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
