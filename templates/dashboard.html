{% extends "layout/base.html" %}

{% block title %}Dashboard - ServiceHub{% endblock %}

{% block content %}
<div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
    <div>
        <h1 class="h3 mb-1"><i class="bi bi-speedometer2 me-2"></i>Dashboard</h1>
        <p class="text-body-secondary mb-0">Selamat datang, {{ current_user.username }}.</p>
    </div>
</div>

<div class="row g-3 mb-4">
    <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-body-secondary small">Total Service</div>
                        <div class="fs-3 fw-bold">{{ total_service }}</div>
                    </div>
                    <i class="bi bi-tools fs-2 text-primary"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-body-secondary small">Menunggu</div>
                        <div class="fs-3 fw-bold">{{ total_menunggu }}</div>
                    </div>
                    <i class="bi bi-hourglass-split fs-2 text-warning"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12 col-md-4">
        <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-body-secondary small">Selesai</div>
                        <div class="fs-3 fw-bold">{{ total_selesai }}</div>
                    </div>
                    <i class="bi bi-check-circle fs-2 text-success"></i>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
