<div class="modal fade" id="modalDeleteKampus{{ kampus.id }}" tabindex="-1" aria-labelledby="modalDeleteKampusLabel{{ kampus.id }}" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <form method="POST" action="{{ url_for('atribut.att_kampus_delete', id=kampus.id) }}">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalDeleteKampusLabel{{ kampus.id }}"><i class="bi bi-trash me-2"></i>Hapus Kampus</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <p class="mb-3">Apakah kamu yakin ingin menghapus kampus berikut?</p>
                    <div class="alert alert-warning mb-0">
                        <div class="fw-semibold"><i class="bi bi-mortarboard me-2"></i>{{ kampus.nama_kampus }}</div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle me-1"></i>Batal</button>
                    <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Ya, Hapus</button>
                </div>
            </form>
        </div>
    </div>
</div>
