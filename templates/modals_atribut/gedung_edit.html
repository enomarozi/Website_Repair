<div class="modal fade" id="modalEditGedung{{ gedung.id }}" tabindex="-1" aria-labelledby="modalEditGedungLabel{{ gedung.id }}" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <form method="POST" action="{{ url_for('atribut.att_gedung_edit', id=gedung.id) }}">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalEditGedungLabel{{ gedung.id }}">
                        <i class="bi bi-buildings me-2"></i>Edit Gedung
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label for="gedung{{ gedung.id }}" class="form-label fw-semibold">
                                <i class="bi bi-buildings me-1 text-primary"></i>Nama Gedung
                            </label>
                            <input type="text" class="form-control" id="gedung{{ gedung.id }}" name="nama_gedung" value="{{ gedung.nama_gedung }}" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle me-1"></i>Batal
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i>Simpan
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
