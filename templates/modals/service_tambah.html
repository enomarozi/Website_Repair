<div class="modal fade" id="modalTambahService" tabindex="-1" aria-labelledby="modalTambahServiceLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <form method="POST" action="{{ url_for('service_tambah') }}">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalTambahServiceLabel"><i class="bi bi-tools me-2"></i>Tambah Service</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nama_service" class="form-label fw-semibold"><i class="bi bi-tools me-1"></i>Nama Service</label>
                            <input type="text" class="form-control" id="nama_service" name="nama_service" placeholder="Masukkan nama service" required>
                        </div>
                        <div class="col-md-6">
                            <label for="status_service" class="form-label fw-semibold"><i class="bi bi-clipboard-check me-1"></i>Status Service</label>
                            <select class="form-select" id="status_service" name="status_service" required>
                                <option value="Menunggu" selected>Menunggu</option>
                                <option value="Selesai">Selesai</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="posisi" class="form-label fw-semibold"><i class="bi bi-geo-alt me-1"></i>Posisi</label>
                            <select class="form-select" id="gedung_id" name="gedung_id" required>
                                <option value="" selected disabled>Pilih posisi gedung</option>

                                {% for gedung in data_gedung %}
                                <option value="{{ gedung.id }}">
                                    {{ gedung.kampus }} - {{ gedung.nama_gedung }} - Lantai {{ gedung.lantai }} - {{ gedung.ruang }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="tgl_perbaikan" class="form-label fw-semibold"><i class="bi bi-calendar-check me-1"></i>Tanggal Perbaikan</label>
                            <input type="date" class="form-control" id="tgl_perbaikan" name="tgl_perbaikan">
                        </div>
                        <div class="col-md-6">
                            <label for="tgl_perbaikan_selanjutnya" class="form-label fw-semibold"><i class="bi bi-calendar-event me-1"></i>Tanggal Perbaikan Selanjutnya</label>
                            <input type="date" class="form-control" id="tgl_perbaikan_selanjutnya" name="tgl_perbaikan_selanjutnya" required>
                        </div>
                        <div class="col-12">
                            <label for="keterangan" class="form-label fw-semibold"><i class="bi bi-card-text me-1"></i>Keterangan</label>
                            <textarea class="form-control" id="keterangan" name="keterangan" rows="4" placeholder="Jelaskan kerusakan atau bagian yang diperbaiki"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle me-1"></i>Batal</button>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Simpan</button>
                </div>
            </form>
        </div>
    </div>
</div>
