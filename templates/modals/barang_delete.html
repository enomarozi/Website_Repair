<div class="modal fade" id="modalDeleteBarang{{ barang.id }}" tabindex="-1" aria-labelledby="modalDeleteBarangLabel{{ barang.id }}" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('barang_hapus', id=barang.id) }}">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalDeleteBarangLabel{{ barang.id }}">
                        <i class="bi bi-trash me-2 text-danger"></i>
                        Hapus Barang
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <p class="mb-2">
                        Apakah kamu yakin ingin menghapus barang berikut?
                    </p>

                    <div class="alert alert-warning mb-0">
                        <strong>{{ barang.nama_barang }}</strong>
                        <br>
                        <small>{{ barang.posisi }}</small>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Batal
                    </button>

                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash me-1"></i>
                        Ya, Hapus
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
