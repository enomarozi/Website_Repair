<div class="modal fade" id="modalEditGedung{{ gedung.id }}" tabindex="-1" aria-labelledby="modalEditGedungLabel{{ gedung.id }}" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <form method="POST" action="{{ url_for('gedung_edit', id=gedung.id) }}">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalEditGedungLabel{{ gedung.id }}"><i class="bi bi-pencil-square me-2"></i>Edit Gedung</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="kampus{{ gedung.id }}" class="form-label fw-semibold"><i class="bi bi-mortarboard me-1"></i>Kampus</label>
                            <select class="form-select" id="kampus{{ gedung.id }}" name="kampus" required>
                                <option value="" disabled>Pilih Kampus</option>
                                {% for a_kampus in att_kampus %}
                                    <option value="{{ a_kampus.nama_kampus }}" {% if gedung.kampus == a_kampus.nama_kampus %}selected{% endif %}>{{ a_kampus.nama_kampus }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="gedung{{ gedung.id }}" class="form-label fw-semibold"><i class="bi bi-buildings me-1"></i>Gedung</label>
                            <select class="form-select" id="gedung{{ gedung.id }}" name="gedung" required>
                                <option value="" disabled>Pilih Gedung</option>
                                {% for a_gedung in att_gedung %}
                                    <option value="{{ a_gedung.nama_gedung }}" {% if gedung.gedung == a_gedung.nama_gedung %}selected{% endif %}>{{ a_gedung.nama_gedung }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="lantai{{ gedung.id }}" class="form-label fw-semibold"><i class="bi bi-layers me-1"></i>Lantai</label>
                            <select class="form-select" id="lantai{{ gedung.id }}" name="lantai" required>
                                <option value="" disabled>Pilih Lantai</option>
                                {% for a_lantai in att_lantai %}
                                    <option value="{{ a_lantai.nama_lantai }}" {% if gedung.lantai == a_lantai.nama_lantai %}selected{% endif %}>{{ a_lantai.nama_lantai }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="ruang{{ gedung.id }}" class="form-label fw-semibold"><i class="bi bi-door-open me-1"></i>Ruang</label>
                            <select class="form-select" id="ruang{{ gedung.id }}" name="ruang" required>
                                <option value="" disabled>Pilih Ruang</option>
                                {% for a_ruang in att_ruang %}
                                    <option value="{{ a_ruang.nama_ruang }}" {% if gedung.ruang == a_ruang.nama_ruang %}selected{% endif %}>{{ a_ruang.nama_ruang }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="keterangan{{ gedung.id }}" class="form-label fw-semibold"><i class="bi bi-card-text me-1"></i>Keterangan</label>
                            <textarea class="form-control" id="keterangan{{ gedung.id }}" name="keterangan" rows="4" placeholder="Tambahkan keterangan jika diperlukan">{{ gedung.keterangan or '' }}</textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle me-1"></i>Batal</button>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>
</div>
