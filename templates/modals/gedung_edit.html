<div class="modal fade" id="modalEditGedung{{ gedung.id }}" tabindex="-1" aria-labelledby="modalEditGedungLabel{{ gedung.id }}" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <form method="POST" action="{{ url_for('gedung_edit', id=gedung.id) }}">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalEditGedungLabel{{ gedung.id }}"><i class="bi bi-pencil-square me-2"></i>Edit Gedung</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="kampus{{ gedung.id }}" class="form-label fw-semibold"><i class="bi bi-buildings me-1"></i>Kampus</label>
                            <input type="text" class="form-control" id="kampus{{ gedung.id }}" name="kampus" value="{{ gedung.kampus }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="nama_gedung{{ gedung.id }}" class="form-label fw-semibold"><i class="bi bi-building me-1"></i>Nama Gedung</label>
                            <input type="text" class="form-control" id="nama_gedung{{ gedung.id }}" name="nama_gedung" value="{{ gedung.nama_gedung }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="lantai{{ gedung.id }}" class="form-label fw-semibold"><i class="bi bi-layers me-1"></i>Lantai</label>
                            <select class="form-select" id="lantai{{ gedung.id }}" name="lantai" required>
                                <option value="1" {% if gedung.lantai == "1" %}selected{% endif %}>Lantai 1</option>
                                <option value="2" {% if gedung.lantai == "2" %}selected{% endif %}>Lantai 2</option>
                                <option value="3" {% if gedung.lantai == "3" %}selected{% endif %}>Lantai 3</option>
                                <option value="4" {% if gedung.lantai == "4" %}selected{% endif %}>Lantai 4</option>
                                <option value="4.5" {% if gedung.lantai == "4.5" %}selected{% endif %}>Lantai 4.5</option>
                                <option value="5" {% if gedung.lantai == "5" %}selected{% endif %}>Lantai 5</option>
                                <option value="6" {% if gedung.lantai == "6" %}selected{% endif %}>Lantai 6</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="ruang{{ gedung.id }}" class="form-label fw-semibold"><i class="bi bi-door-open me-1"></i>Ruang</label>
                            <input type="text" class="form-control" id="ruang{{ gedung.id }}" name="ruang" value="{{ gedung.ruang }}" required>
                        </div>
                        <div class="col-12">
                            <label for="keterangan{{ gedung.id }}" class="form-label fw-semibold"><i class="bi bi-card-text me-1"></i>Keterangan</label>
                            <textarea class="form-control" id="keterangan{{ gedung.id }}" name="keterangan" rows="4" placeholder="Tambahkan keterangan jika diperlukan">{{ gedung.keterangan or '' }}</textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle me-1"></i>Batal</button>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>
</div>
