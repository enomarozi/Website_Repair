<div class="modal fade" id="modalEditPerangkat{{ perangkat.id }}" tabindex="-1" aria-labelledby="modalEditPerangkatLabel{{ perangkat.id }}" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <form method="POST" action="{{ url_for('perangkat_edit', id=perangkat.id) }}">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalEditPerangkatLabel{{ perangkat.id }}"><i class="bi bi-pencil-square me-2"></i>Edit Perangkat</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="perangkat{{ perangkat.id }}" class="form-label fw-semibold"><i class="bi bi-box-seam me-1 text-primary"></i>Nama Perangkat</label>
                            <select class="form-select" id="perangkat{{ perangkat.id }}" name="perangkat" required>
                                <option value="" disabled>Pilih Perangkat</option>
                                {% for a_perangkat in att_perangkat %}
                                    <option value="{{ a_perangkat.nama_perangkat }}" {% if perangkat.perangkat == a_perangkat.nama_perangkat %}selected{% endif %}>{{ a_perangkat.nama_perangkat }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="merek{{ perangkat.id }}" class="form-label fw-semibold"><i class="bi bi-tag me-1 text-primary"></i>Merek</label>
                            <select class="form-select" id="merek{{ perangkat.id }}" name="merek" required>
                                <option value="" disabled>Pilih Merek</option>
                                {% for a_merek in att_merek %}
                                    <option value="{{ a_merek.nama_merek }}" {% if perangkat.merek == a_merek.nama_merek %}selected{% endif %}>{{ a_merek.nama_merek }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="type{{ perangkat.id }}" class="form-label fw-semibold"><i class="bi bi-card-text me-1 text-primary"></i>Type / Model</label>
                            <input type="text" class="form-control" id="type{{ perangkat.id }}" name="type" value="{{ perangkat.type }}" placeholder="Masukkan type atau model" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle me-1"></i>Batal</button>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>
</div>
