<div class="modal fade" id="modalTambahGedung" tabindex="-1" aria-labelledby="modalTambahGedungLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <form method="POST" action="{{ url_for('gedung_tambah') }}">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalTambahGedungLabel"><i class="bi bi-building me-2"></i>Tambah Gedung</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="kampus" class="form-label fw-semibold"><i class="bi bi-mortarboard me-1"></i>Kampus</label>
                            <select class="form-select" id="kampus" name="kampus" required>
                                <option value="" selected disabled>Pilih Kampus</option>
                                {% for a_kampus in att_kampus %}
                                    <option value="{{ a_kampus.nama_kampus }}">{{ a_kampus.nama_kampus }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="gedung" class="form-label fw-semibold"><i class="bi bi-buildings me-1"></i>Gedung</label>
                            <select class="form-select" id="gedung" name="gedung" required>
                                <option value="" selected disabled>Pilih Gedung</option>
                                {% for a_gedung in att_gedung %}
                                    <option value="{{ a_gedung.nama_gedung }}">{{ a_gedung.nama_gedung }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="lantai" class="form-label fw-semibold"><i class="bi bi-layers me-1"></i>Lantai</label>
                            <select class="form-select" id="lantai" name="lantai" required>
                                <option value="" selected disabled>Pilih Lantai</option>
                                {% for a_lantai in att_lantai %}
                                    <option value="{{ a_lantai.nama_lantai }}">{{ a_lantai.nama_lantai }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="ruang" class="form-label fw-semibold"><i class="bi bi-door-open me-1"></i>Ruang</label>
                            <select class="form-select" id="ruang" name="ruang" required>
                                <option value="" selected disabled>Pilih Ruang</option>
                                {% for a_ruang in att_ruang %}
                                    <option value="{{ a_ruang.nama_ruang }}">{{ a_ruang.nama_ruang }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="keterangan" class="form-label fw-semibold"><i class="bi bi-card-text me-1"></i>Keterangan</label>
                            <textarea class="form-control" id="keterangan" name="keterangan" rows="4" placeholder="Tambahkan keterangan jika diperlukan"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle me-1"></i>Batal</button>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i>Simpan</button>
                </div>
            </form>
        </div>
    </div>
</div>
