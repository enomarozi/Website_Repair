<div class="modal fade" id="modalTambahBarang" tabindex="-1" aria-labelledby="modalTambahBarangLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('barang_tambah') }}">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTambahBarangLabel">
                        <i class="bi bi-plus-circle me-2"></i>
                        Tambah Barang
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nama_barang" class="form-label">Nama Barang</label>
                            <input type="text" class="form-control" id="nama_barang" name="nama_barang" required>
                        </div>

                        <div class="col-md-6">
                            <label for="status_barang" class="form-label">Status Barang</label>
                            <select class="form-select" id="status_barang" name="status_barang" required>
                                <option value="">Pilih status</option>
                                <option value="Menunggu">Menunggu</option>
                                <option value="Dalam Perbaikan">Dalam Perbaikan</option>
                                <option value="Selesai">Selesai</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="posisi" class="form-label">Posisi</label>
                            <input type="text" class="form-control" id="posisi" name="posisi" placeholder="Contoh: Ruang IT" required>
                        </div>

                        <div class="col-md-6">
                            <label for="tgl_perbaikan" class="form-label">Tanggal Perbaikan</label>
                            <input type="date" class="form-control" id="tgl_perbaikan" name="tgl_perbaikan" required>
                        </div>

                        <div class="col-md-6">
                            <label for="tgl_diperbaiki" class="form-label">Tanggal Diperbaiki</label>
                            <input type="date" class="form-control" id="tgl_diperbaiki" name="tgl_diperbaiki">
                        </div>

                        <div class="col-12">
                            <label for="keterangan" class="form-label">Keterangan</label>
                            <textarea class="form-control" id="keterangan" name="keterangan" rows="4" placeholder="Jelaskan kerusakan atau bagian yang diperbaiki"></textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Batal
                    </button>

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i>
                        Simpan
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
