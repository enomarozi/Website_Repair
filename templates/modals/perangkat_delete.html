<div class="modal fade" id="modalDeletePerangkat{{ perangkat.id }}" tabindex="-1" aria-labelledby="modalDeletePerangkatLabel{{ perangkat.id }}" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <form method="POST" action="{{ url_for('perangkat_hapus', id=perangkat.id) }}">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title" id="modalDeletePerangkatLabel{{ perangkat.id }}"><i class="bi bi-trash me-2"></i>Hapus Perangkat</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <p class="mb-3">Apakah kamu yakin ingin menghapus perangkat berikut?</p>
                    <div class="alert alert-warning mb-0">
                        <div class="fw-semibold"><i class="bi bi-box-seam me-2"></i>{{ perangkat.perangkat }}</div>
                        <div><i class="bi bi-tag me-2"></i>{{ perangkat.merek }}</div>
                        <div><i class="bi bi-card-text me-2"></i>{{ perangkat.type }}</div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle me-1"></i>Batal</button>
                    <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Ya, Hapus</button>
                </div>
            </form>
        </div>
    </div>
</div>
